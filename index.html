<style>
*{box-sizing:border-box}
:root{--bg:#0b3a3f;--card:#0f4a50;--ink:#ecfbfb;--muted:#9fd3d6;--accent:#2fd0d9;--err:#ff9a8f;--field:#0a3438;--line:#1c5b61}
html,body{height:100%}
body{margin:0;background:linear-gradient(160deg,#0b3a3f,#072a2e);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Readex Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  direction:rtl;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-tap-highlight-color:transparent}
.box{width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:30px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.mk{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;
  margin:0 auto 14px;font-size:26px;font-weight:800;color:#062023;font-family:"Readex Pro",sans-serif}
h1{font-size:18px;margin:0 0 4px;font-weight:700}
p.sub{font-size:12.5px;color:var(--muted);margin:0 0 20px}
input{width:100%;text-align:center;letter-spacing:.5em;font-size:26px;font-weight:700;
  padding:14px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);
  font-family:inherit;outline:none}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--accent);
  color:#062023;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);font-size:13px;font-weight:600;min-height:18px;margin-top:12px}
.hint{color:var(--muted);font-size:11px;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="mk">ل</div>
  <h1>نظام لطيفة الحربي للحضور</h1>
  <p class="sub">أدخلي الرمز للدخول</p>
  <input id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8"
         autocomplete="off" aria-label="الرمز" />
  <button id="go" type="submit">دخول</button>
  <div class="err" id="err"></div>
  <div class="hint">الرمز محفوظ داخل جهازك فقط ولا يظهر في ملف الموقع.<br>إن نسيتِ الرمز راجعي مطوّرة النظام.</div>
</form>

function b64d(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)});}
var f=document.getElementById("f"),pin=document.getElementById("pin"),
    go=document.getElementById("go"),err=document.getElementById("err");
async function unlock(code){
  var enc=new TextEncoder();
  var km=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64d(P.salt),iterations:P.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  var buf;
  try{ buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(P.iv)},key,b64d(P.ct)); }
  catch(e){ return false; }
  var html=new TextDecoder().decode(buf);
  try{ sessionStorage.setItem("latefah_session_code",code); }catch(e){}
  document.open(); document.write(html); document.close();
  return true;
}
f.addEventListener("submit",async function(e){
  e.preventDefault();
  var code=pin.value.trim();
  if(!code){ pin.focus(); return; }
  go.disabled=true; err.textContent="جارٍ التحقق…";
  var ok=await unlock(code);
  if(!ok){ err.textContent="الرمز غير صحيح"; go.disabled=false; pin.value=""; pin.focus(); }
});
try{
  var s=sessionStorage.getItem("latefah_session_code");
  if(s){ err.textContent="جارٍ الفتح…"; unlock(s).then(function(ok){ if(!ok){ err.textContent=""; sessionStorage.removeItem("latefah_session_code"); } }); }
}catch(e){}
pin.focus();
